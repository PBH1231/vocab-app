<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng - Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS cho hiệu ứng lật thẻ 3D */
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen p-4">

    <div id="loading" class="text-xl font-semibold text-gray-600 mb-4">Đang tải dữ liệu...</div>
    <div id="progressCounter" class="text-sm font-bold text-blue-500 mb-4 hidden">Từ 1 / 3</div>

    <div id="flashcardContainer" class="w-full max-w-sm w-[350px] h-[500px] perspective cursor-pointer hidden" onclick="flipCard()">
        <div id="flashcard" class="relative w-full h-full preserve-3d card-transition shadow-2xl rounded-2xl">
            
            <div class="absolute w-full h-full backface-hidden bg-white rounded-2xl flex flex-col items-center justify-center p-6 border-t-4 border-blue-500">
                <h2 id="word" class="text-4xl font-bold text-gray-800 mb-2"></h2>
                <p id="phonetic" class="text-gray-500 text-lg mb-1"></p>
                <span id="pos" class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-sm font-semibold mb-6"></span>
                
                <button onclick="playAudio(event)" class="p-4 bg-gray-100 rounded-full hover:bg-gray-200 transition shadow-sm">
                    <svg class="w-8 h-8 text-gray-700" fill="currentColor" viewBox="0 0 20 20"><path d="M10 3.5a.5.5 0 00-.5.5v12a.5.5 0 001 0V4a.5.5 0 00-.5-.5z"/><path fill-rule="evenodd" d="M10.707 3.293a1 1 0 010 1.414L6.414 9H3a1 1 0 00-1 1v4a1 1 0 001 1h3.414l4.293 4.293a1 1 0 001.707-.707V3.5a1 1 0 00-1.707-.707z" clip-rule="evenodd"/></svg>
                </button>
            </div>

            <div class="absolute w-full h-full backface-hidden bg-gray-50 rounded-2xl flex flex-col items-center justify-center p-6 rotate-y-180 border-t-4 border-green-500">
                <h3 id="meaning" class="text-3xl font-bold text-gray-800 mb-6 text-center"></h3>
                <div class="bg-white p-5 rounded-xl shadow-sm w-full mb-6 border border-gray-100">
                    <p id="example" class="text-gray-700 italic mb-3 text-lg"></p>
                    <p id="translation" class="text-gray-500 text-sm"></p>
                </div>
                <button onclick="markLearned(event)" class="mt-4 px-6 py-3 bg-green-500 text-white font-bold rounded-xl hover:bg-green-600 transition w-full shadow-md text-lg">
                    Đã thuộc từ này
                </button>
            </div>
        </div>
    </div>

    <button id="nextBtn" onclick="nextCard()" class="mt-8 px-6 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition hidden">
        Chưa thuộc, Bỏ qua ->
    </button>

    <script>
        let vocabList = [];
        let currentIndex = 0;
        let isFlipped = false;

        // Tự động chạy khi load trang
        document.addEventListener("DOMContentLoaded", fetchVocab);

        // 1. Gọi API lấy dữ liệu
        async function fetchVocab() {
            try {
                const response = await fetch('http://localhost:8000/api/sets/1/flashcards?user_id=1');
                const data = await response.json();
                
                vocabList = data.words;
                
                if (vocabList.length > 0) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('flashcardContainer').classList.remove('hidden');
                    document.getElementById('progressCounter').classList.remove('hidden');
                    document.getElementById('nextBtn').classList.remove('hidden');
                    renderCard();
                } else {
                    document.getElementById('loading').innerText = "Không có từ vựng nào trong bộ này.";
                }
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('loading').innerText = "Lỗi kết nối máy chủ!";
            }
        }

        // 2. Render dữ liệu lên thẻ
        function renderCard() {
            if (currentIndex >= vocabList.length) {
                document.getElementById('flashcardContainer').innerHTML = "<h2 class='text-2xl font-bold text-green-600 text-center mt-20'>Chúc mừng! Bạn đã ôn tập xong.</h2>";
                document.getElementById('progressCounter').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                return;
            }

            const currentWord = vocabList[currentIndex];
            
            // Cập nhật mặt trước
            document.getElementById('word').innerText = currentWord.word;
            document.getElementById('phonetic').innerText = currentWord.phonetic || '';
            document.getElementById('pos').innerText = currentWord.part_of_speech || '';
            
            // Cập nhật mặt sau
            document.getElementById('meaning').innerText = currentWord.meaning;
            document.getElementById('example').innerText = `"${currentWord.example}"`;
            document.getElementById('translation').innerText = currentWord.example_translation;

            // Cập nhật bộ đếm
            document.getElementById('progressCounter').innerText = `Từ ${currentIndex + 1} / ${vocabList.length}`;
            
            // Đảm bảo thẻ úp lại khi chuyển sang từ mới
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('rotate-y-180');
        }

        // 3. Logic Lật thẻ
        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            if(isFlipped) card.classList.add('rotate-y-180');
            else card.classList.remove('rotate-y-180');
        }

        // 4. Logic Phát âm qua Free API
        async function playAudio(event) {
            event.stopPropagation(); // Ngăn lật thẻ khi bấm loa
            const wordToPlay = vocabList[currentIndex].word;
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${wordToPlay}`);
                const data = await response.json();
                const audioUrl = data[0].phonetics.find(p => p.audio).audio;
                
                if(audioUrl) {
                    new Audio(audioUrl).play();
                } else {
                    alert('Không tìm thấy file ghi âm cho từ này.');
                }
            } catch (error) {
                console.error("Lỗi âm thanh:", error);
            }
        }

        // 5. Logic Đã thuộc (Gửi API lưu tiến độ)
        async function markLearned(event) {
            event.stopPropagation(); // Ngăn lật thẻ lại
            const currentWord = vocabList[currentIndex];
            
            try {
                await fetch('http://localhost:8000/api/progress/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 1,
                        vocab_id: currentWord.id,
                        is_learned: true
                    })
                });
                // Chuyển sang từ tiếp theo
                nextCard();
            } catch (error) {
                alert("Lỗi lưu tiến độ!");
            }
        }

        // 6. Logic Bỏ qua / Chuyển từ
        function nextCard() {
            currentIndex++;
            renderCard();
        }
    </script>
</body>
</html>
