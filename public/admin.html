<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Từ Vựng - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg border-t-4 border-blue-500">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Thêm Từ Vựng Mới</h2>
        
        <form id="addWordForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Từ tiếng Anh *</label>
                    <input type="text" id="word" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Loại từ</label>
                    <input type="text" id="pos" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition" placeholder="vd: verb, noun...">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Phát âm</label>
                <input type="text" id="phonetic" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition" placeholder="vd: /inˈkôrpəˌrāt/">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Nghĩa tiếng Việt *</label>
                <input type="text" id="meaning" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition" required>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Câu ví dụ</label>
                <input type="text" id="example" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Dịch câu ví dụ</label>
                <input type="text" id="translation" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-md mt-4 text-lg">
                + Lưu vào Cơ Sở Dữ Liệu
            </button>
        </form>
    </div>

    <script>
        document.getElementById('addWordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            btn.innerText = "Đang lưu...";
            
            const newWord = {
                set_id: 1, // Tạm thời đẩy mặc định vào bộ số 1
                word: document.getElementById('word').value,
                part_of_speech: document.getElementById('pos').value,
                phonetic: document.getElementById('phonetic').value,
                meaning: document.getElementById('meaning').value,
                example: document.getElementById('example').value,
                example_translation: document.getElementById('translation').value
            };

            try {
                // Gọi tới máy chủ Render của bạn
                const res = await fetch('https://vocab-api-9689.onrender.com/api/words', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(newWord)
                });
                
                if (res.ok) {
                    alert("Thêm từ vựng thành công!");
                    e.target.reset(); // Xóa trắng form để nhập từ tiếp theo
                } else {
                    alert("Có lỗi khi lưu vào Database.");
                }
            } catch(err) { 
                alert("Lỗi kết nối máy chủ!"); 
            } finally {
                btn.innerText = "+ Lưu vào Cơ Sở Dữ Liệu";
            }
        });
    </script>
</body>
</html>
