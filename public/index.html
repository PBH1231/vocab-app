<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Từ Vựng - Bảng Điều Khiển</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-800">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 shadow-sm z-10">
        <div class="p-6 flex items-center space-x-3 border-b border-gray-100">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">V</div>
            <span class="text-xl font-extrabold text-blue-600">VocabApp</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('dashboard')" class="w-full flex items-center space-x-3 p-3 bg-blue-50 text-blue-600 rounded-xl font-medium transition">
                <i class="fa-solid fa-house w-5"></i><span>Tổng quan</span>
            </button>
            <button onclick="switchTab('sets')" class="w-full flex items-center space-x-3 p-3 text-gray-500 hover:bg-gray-50 hover:text-blue-600 rounded-xl font-medium transition">
                <i class="fa-solid fa-layer-group w-5"></i><span>Bộ từ vựng</span>
            </button>
            <button onclick="toggleWordModal(true)" class="w-full flex items-center space-x-3 p-3 text-gray-500 hover:bg-gray-50 hover:text-blue-600 rounded-xl font-medium transition">
                <i class="fa-solid fa-plus-circle w-5"></i><span>Thêm từ mới</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto pb-20 md:pb-0 relative">
        <header class="md:hidden bg-white p-4 border-b border-gray-200 flex justify-between items-center sticky top-0 z-10">
            <span class="text-xl font-extrabold text-blue-600">VocabApp</span>
            <button onclick="toggleWordModal(true)" class="text-blue-600 font-bold"><i class="fa-solid fa-plus text-xl"></i></button>
        </header>

        <div class="p-4 md:p-8 max-w-5xl mx-auto w-full">
            
            <div id="tab-dashboard" class="space-y-6">
                <h2 class="text-2xl font-bold">Chào mừng trở lại! 👋</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <span class="text-gray-500 text-sm">Đã học</span>
                        <div class="text-2xl font-bold text-blue-600 mt-1">124 <span class="text-xs text-gray-400">từ</span></div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <span class="text-gray-500 text-sm">Cần ôn</span>
                        <div class="text-2xl font-bold text-orange-500 mt-1">18 <span class="text-xs text-gray-400">từ</span></div>
                    </div>
                </div>

                <h3 class="text-xl font-bold mb-4">Gợi ý học hôm nay</h3>
                <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-5 flex flex-col md:flex-row justify-between md:items-center gap-4">
                    <div>
                        <h4 class="text-lg font-bold text-gray-800">TOEIC Mục tiêu 600+</h4>
                        <p class="text-sm text-gray-500 mt-1">Ôn tập ngay để duy trì chuỗi ngày học tập.</p>
                    </div>
                    <a href="learn.html?set_id=1" class="text-center bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow hover:bg-blue-700">
                        Học ngay
                    </a>
                </div>
            </div>

            <div id="tab-sets" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold">Tất cả Bộ từ vựng</h2>
                    <button onclick="toggleSetModal(true)" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-200 transition">+ Tạo bộ mới</button>
                </div>
                <div id="sets-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-gray-500 text-center py-10 bg-white rounded-2xl border border-dashed border-gray-300">
                    Đang tải dữ liệu bộ từ vựng từ máy chủ...
                </div>
            </div>

        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pb-safe z-10">
        <button onclick="switchTab('dashboard')" class="flex flex-col items-center py-3 px-4 text-blue-600 transition">
            <i class="fa-solid fa-house text-xl mb-1"></i><span class="text-[10px] font-bold">Tổng quan</span>
        </button>
        <button onclick="switchTab('sets')" class="flex flex-col items-center py-3 px-4 text-gray-400 hover:text-blue-600 transition">
            <i class="fa-solid fa-layer-group text-xl mb-1"></i><span class="text-[10px] font-bold">Bộ từ vựng</span>
        </button>
        <button onclick="toggleWordModal(true)" class="flex flex-col items-center py-3 px-4 text-gray-400 hover:text-blue-600 transition">
            <i class="fa-solid fa-plus-circle text-xl mb-1"></i><span class="text-[10px] font-bold">Thêm từ</span>
        </button>
    </nav>

    <div id="addSetModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800">Tạo Bộ Từ Vựng Mới</h3>
                <button onclick="toggleSetModal(false)" class="text-gray-400 hover:text-red-500 transition text-2xl">&times;</button>
            </div>
            
            <form id="addSetForm" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tên bộ từ vựng *</label>
                    <input type="text" id="setTitle" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Mô tả chi tiết</label>
                    <textarea id="setDesc" rows="3" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <div class="flex gap-3 pt-4 mt-4 border-t border-gray-100">
                    <button type="button" onclick="toggleSetModal(false)" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-200 transition">Bỏ qua</button>
                    <button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-md">Tạo ngay</button>
                </div>
            </form>
        </div>
    </div>

    <div id="addWordModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800">Thêm Từ Mới</h3>
                <button onclick="toggleWordModal(false)" class="text-gray-400 hover:text-red-500 transition text-2xl">&times;</button>
            </div>
            
            <form id="addWordForm" class="p-6 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Lưu vào bộ *</label>
                    <select id="wordSetId" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="">Đang tải danh sách bộ từ vựng...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Từ tiếng Anh *</label>
                        <input type="text" id="word" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nghĩa tiếng Việt *</label>
                        <input type="text" id="meaning" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Loại từ</label>
                        <input type="text" id="pos" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="vd: noun, verb">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Phát âm</label>
                        <input type="text" id="phonetic" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Câu ví dụ</label>
                    <input type="text" id="example" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="vd: This is an example.">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Dịch câu ví dụ</label>
                    <input type="text" id="exampleTrans" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="vd: Đây là một ví dụ.">
                </div>

                <div class="flex gap-3 pt-4 mt-2 border-t border-gray-100">
                    <button type="button" onclick="toggleWordModal(false)" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-200 transition">Bỏ qua</button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-md">Lưu từ vựng</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. Logic chuyển Tab và sáng màu Menu
        function switchTab(tabName) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-sets').classList.add('hidden');
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            const buttons = document.querySelectorAll(`button[onclick^="switchTab"]`);
            buttons.forEach(btn => {
                if (btn.classList.contains('flex-col')) { 
                    btn.className = "flex flex-col items-center py-3 px-4 text-gray-400 hover:text-blue-600 transition";
                } else { 
                    btn.className = "w-full flex items-center space-x-3 p-3 text-gray-500 hover:bg-gray-50 hover:text-blue-600 rounded-xl font-medium transition";
                }
            });

            const activeButtons = document.querySelectorAll(`button[onclick="switchTab('${tabName}')"]`);
            activeButtons.forEach(btn => {
                if (btn.classList.contains('flex-col')) { 
                    btn.className = "flex flex-col items-center py-3 px-4 text-blue-600 transition";
                } else { 
                    btn.className = "w-full flex items-center space-x-3 p-3 bg-blue-50 text-blue-600 rounded-xl font-medium transition";
                }
            });
        }

        // 2. Logic Bật/Tắt các Modal
        function toggleWordModal(show) {
            const modal = document.getElementById('addWordModal');
            if(show) modal.classList.remove('hidden');
            else {
                modal.classList.add('hidden');
                document.getElementById('addWordForm').reset();
            }
        }

        function toggleSetModal(show) {
            const modal = document.getElementById('addSetModal');
            if(show) modal.classList.remove('hidden');
            else {
                modal.classList.add('hidden');
                document.getElementById('addSetForm').reset();
            }
        }

        // 3. Logic Fetch dữ liệu Bộ từ vựng & Nạp vào Dropdown
        async function fetchSets() {
            const container = document.getElementById('sets-container');
            const dropdown = document.getElementById('wordSetId');
            
            try {
                const response = await fetch('https://vocab-api-9689.onrender.com/api/sets');
                if (!response.ok) throw new Error("Lỗi API");
                const sets = await response.json();
                
                container.innerHTML = '';
                container.classList.remove('py-10', 'border-dashed', 'border-gray-300', 'text-center');
                dropdown.innerHTML = ''; // Xóa dữ liệu cũ của dropdown

                if (sets.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">Chưa có bộ từ vựng nào.</p>';
                    dropdown.innerHTML = '<option value="">Vui lòng tạo bộ từ vựng trước</option>';
                    return;
                }

                // Render dữ liệu ra giao diện
                sets.forEach(vocabSet => {
                    // Đổ ra giao diện Tab "Bộ từ vựng"
                    const cardHTML = `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition p-5 flex flex-col justify-between text-left">
                            <div>
                                <div class="flex items-center space-x-2 mb-2">
                                    <span class="px-2 py-1 bg-blue-100 text-blue-700 text-[10px] font-bold rounded uppercase">ID: ${vocabSet.id}</span>
                                </div>
                                <h4 class="text-lg font-bold text-gray-800 mb-1">${vocabSet.title}</h4>
                                <p class="text-sm text-gray-500 mb-4 line-clamp-2">${vocabSet.description || 'Không có mô tả'}</p>
                            </div>
                            <div class="flex gap-2 mt-2 pt-4 border-t border-gray-50">
                                <a href="learn.html?set_id=${vocabSet.id}" class="flex-1 text-center bg-blue-50 text-blue-600 px-4 py-2 rounded-xl font-bold text-sm hover:bg-blue-100 transition shadow-sm">
                                    <i class="fa-solid fa-bolt mr-1"></i> Ôn tập
                                </a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;

                    // Đổ tên bộ từ vựng vào Dropdown của Form thêm từ mới
                    dropdown.innerHTML += `<option value="${vocabSet.id}">${vocabSet.title}</option>`;
                });
            } catch (error) {
                container.innerHTML = '<p class="col-span-full text-center text-red-500 py-8">Không thể tải dữ liệu.</p>';
            }
        }

        // 4. Submit Form Tạo Bộ Từ Vựng
        document.getElementById('addSetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Đang tạo...";
            
            const newSet = {
                title: document.getElementById('setTitle').value,
                description: document.getElementById('setDesc').value
            };

            try {
                const res = await fetch('https://vocab-api-9689.onrender.com/api/sets', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(newSet)
                });
                
                if (res.ok) {
                    toggleSetModal(false);
                    fetchSets(); // Load lại danh sách ngay lập tức để hiện bộ mới
                } else alert("Lỗi khi tạo bộ từ vựng.");
            } catch(err) { alert("Lỗi kết nối!"); } 
            finally { btn.innerText = "Tạo ngay"; }
        });

        // 5. Submit Form Thêm Từ Vựng
        document.getElementById('addWordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Đang lưu...";
            
            const newWord = {
                set_id: parseInt(document.getElementById('wordSetId').value), // Lấy ID từ Dropdown
                word: document.getElementById('word').value,
                meaning: document.getElementById('meaning').value,
                part_of_speech: document.getElementById('pos').value,
                phonetic: document.getElementById('phonetic').value,
                example: document.getElementById('example').value,          // Lấy câu ví dụ
                example_translation: document.getElementById('exampleTrans').value // Lấy dịch câu ví dụ
            };

            try {
                const res = await fetch('https://vocab-api-9689.onrender.com/api/words', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(newWord)
                });
                
                if (res.ok) {
                    toggleWordModal(false);
                    alert("Đã thêm từ vựng thành công!");
                } else alert("Lỗi khi lưu từ vựng.");
            } catch(err) { alert("Lỗi kết nối!"); } 
            finally { btn.innerText = "Lưu từ vựng"; }
        });

        // Khởi tạo ngay khi mở trang
        document.addEventListener("DOMContentLoaded", fetchSets);
    </script>
</body>
</html>
