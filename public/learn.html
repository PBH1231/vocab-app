<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">

    <header class="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-10">
        <a href="index.html" class="text-gray-500 hover:text-blue-600 transition p-2"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h1 id="setHeader" class="font-bold text-lg text-gray-700 truncate px-4">Đang tải...</h1>
        <div class="w-8"></div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 w-full max-w-md mx-auto">
        
        <div id="progress-section" class="w-full flex justify-between text-sm font-bold mb-4 px-2">
            <div class="text-orange-500"><i class="fa-solid fa-brain"></i> Chưa thuộc: <span id="notLearnedCount">0</span></div>
            <div class="text-gray-400" id="progressText">0 / 0</div>
            <div class="text-green-500"><i class="fa-solid fa-check-circle"></i> Đã thuộc: <span id="learnedCount">0</span></div>
        </div>
        <div id="progress-bar-container" class="w-full bg-gray-200 rounded-full h-2 mb-8">
            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <div id="flashcard-container" class="w-full perspective-1000 cursor-pointer h-80 relative" onclick="flipCard()">
            <div id="card-front" class="absolute w-full h-full bg-white rounded-3xl shadow-lg border border-gray-100 flex flex-col items-center justify-center p-6 text-center transform-style-3d backface-hidden card-transition">
                <span id="posLabel" class="absolute top-4 right-4 px-3 py-1 bg-blue-50 text-blue-600 text-xs font-bold uppercase rounded-lg hidden"></span>
                <h2 id="wordText" class="text-4xl font-extrabold text-gray-800 mb-2">Đang tải...</h2>
                
                <div class="flex items-center justify-center gap-3 mb-2">
                    <p id="phoneticText" class="text-gray-400 font-medium tracking-wide"></p>
                    <button onclick="playAudio(event)" id="audioBtn" class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200 hover:scale-110 transition shadow-sm hidden" title="Nghe phát âm">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>

                <div class="absolute bottom-6 text-gray-300 text-sm flex items-center gap-2"><i class="fa-solid fa-hand-pointer"></i> Nhấn để xem nghĩa</div>
            </div>

            <div id="card-back" class="absolute w-full h-full bg-blue-600 rounded-3xl shadow-lg flex flex-col items-center justify-center p-6 text-center transform-style-3d backface-hidden rotate-y-180 card-transition text-white">
                <h2 id="meaningText" class="text-2xl font-bold mb-4"></h2>
                <div id="exampleBox" class="bg-blue-700 bg-opacity-50 p-4 rounded-xl w-full hidden">
                    <p id="exampleText" class="italic mb-2 text-sm"></p>
                    <p id="exampleTransText" class="text-xs text-blue-200"></p>
                </div>
            </div>
        </div>

        <div id="action-buttons" class="flex gap-4 w-full mt-10">
            <button onclick="markWord(false)" class="flex-1 bg-white border-2 border-orange-200 text-orange-500 font-bold py-4 rounded-2xl hover:bg-orange-50 transition shadow-sm">
                <i class="fa-solid fa-xmark mr-2"></i> Chưa thuộc
            </button>
            <button onclick="markWord(true)" class="flex-1 bg-white border-2 border-green-200 text-green-500 font-bold py-4 rounded-2xl hover:bg-green-50 transition shadow-sm">
                <i class="fa-solid fa-check mr-2"></i> Đã thuộc
            </button>
        </div>
    </main>


    <!-- Giao diện tổng kết sau khi học xong. Tìm keyword completionModal để kiểm tra đúng file. -->
    <div id="completionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] hidden items-center justify-center p-4">
        <div class="w-full max-w-lg rounded-[2rem] bg-white shadow-2xl overflow-hidden border border-slate-100">
            <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 px-8 py-8 text-white text-center">
                <div class="mx-auto mb-4 w-20 h-20 rounded-full bg-white/15 border border-white/20 flex items-center justify-center text-4xl shadow-inner">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-3xl font-extrabold">Hoàn thành rồi! 🎉</h2>
                <p class="mt-2 text-blue-100">Bạn vừa học xong bộ flashcards này.</p>
                <p id="completionSetName" class="mt-3 text-sm font-semibold tracking-wide uppercase text-white/90"></p>
            </div>

            <div class="p-6 md:p-8">
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="rounded-2xl bg-blue-50 p-4 text-center">
                        <div class="text-xs uppercase font-bold text-blue-600">Tổng số</div>
                        <div id="summaryTotal" class="mt-1 text-2xl font-extrabold text-slate-800">0</div>
                    </div>
                    <div class="rounded-2xl bg-green-50 p-4 text-center">
                        <div class="text-xs uppercase font-bold text-green-600">Đã thuộc</div>
                        <div id="summaryLearned" class="mt-1 text-2xl font-extrabold text-slate-800">0</div>
                    </div>
                    <div class="rounded-2xl bg-orange-50 p-4 text-center">
                        <div class="text-xs uppercase font-bold text-orange-600">Cần ôn</div>
                        <div id="summaryNeedReview" class="mt-1 text-2xl font-extrabold text-slate-800">0</div>
                    </div>
                </div>

                <div class="rounded-2xl border border-slate-100 bg-slate-50 p-4 mb-6">
                    <div class="flex justify-between items-center mb-2 text-sm font-semibold text-slate-600">
                        <span>Mức độ thuộc</span>
                        <span id="summaryPercent">0%</span>
                    </div>
                    <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden">
                        <div id="summaryBar" class="h-full rounded-full bg-gradient-to-r from-green-500 to-emerald-500" style="width: 0%"></div>
                    </div>
                    <p id="summaryMessage" class="mt-3 text-sm text-slate-500"></p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button onclick="restartCurrentSession()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-2xl hover:bg-blue-700 transition shadow-sm">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Học lại từ đầu
                    </button>
                    <button onclick="reviewUnlearned()" class="w-full bg-orange-100 text-orange-700 font-bold py-3 px-4 rounded-2xl hover:bg-orange-200 transition shadow-sm">
                        <i class="fa-solid fa-brain mr-2"></i> Ôn từ chưa thuộc
                    </button>
                    <a id="shuffleAgainLink" href="#" class="w-full text-center bg-indigo-100 text-indigo-700 font-bold py-3 px-4 rounded-2xl hover:bg-indigo-200 transition shadow-sm">
                        <i class="fa-solid fa-shuffle mr-2"></i> Học lại ngẫu nhiên
                    </a>
                    <a href="index.html" class="w-full text-center bg-slate-100 text-slate-700 font-bold py-3 px-4 rounded-2xl hover:bg-slate-200 transition shadow-sm">
                        <i class="fa-solid fa-house mr-2"></i> Về trang chủ
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let words = [];
        let currentIndex = 0;
        let isFlipped = false;
        let countLearned = 0;
        let countNotLearned = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const setId = urlParams.get('set_id') || 1;
        const mode = urlParams.get('mode') || 'all';

        async function init() {
            try {
                let apiUrl = `https://vocab-api-9689.onrender.com/api/sets/${setId}/flashcards?user_id=1`;
                if (mode === 'unlearned') {
                    apiUrl = `https://vocab-api-9689.onrender.com/api/sets/${setId}/unlearned?user_id=1`;
                }

                const res = await fetch(apiUrl);
                const data = await res.json();
                
                document.getElementById('setHeader').innerText = data.set_title || "Bộ Từ Vựng";
                words = data.words;

                if (words && words.length > 0) {
                    renderCard();
                } else {
                    // XỬ LÝ GIAO DIỆN KHI TRỐNG (HOÀN THÀNH)
                    // 1. Ẩn thanh tiến độ và các nút đánh giá
                    document.getElementById('progress-section').classList.add('hidden');
                    document.getElementById('progress-bar-container').classList.add('hidden');
                    document.getElementById('action-buttons').classList.add('hidden');
                    
                    // 2. Vô hiệu hóa tính năng click lật thẻ
                    const container = document.getElementById('flashcard-container');
                    container.onclick = null; 
                    
                    // 3. Đổ giao diện chúc mừng tuyệt đẹp vào khung thẻ bài
                    container.innerHTML = `
                        <div class="absolute w-full h-full bg-white rounded-3xl shadow-lg border border-green-100 flex flex-col items-center justify-center p-8 text-center z-10">
                            <div class="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner">
                                <i class="fa-solid fa-trophy"></i>
                            </div>
                            <h2 class="text-3xl font-extrabold text-gray-800 mb-3">Tuyệt vời!</h2>
                            <p class="text-gray-500 font-medium mb-8">Bạn đã hoàn thành mục tiêu ôn tập của bộ từ vựng này.</p>
                            <a href="index.html" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 transition w-full">
                                Về Trang Chủ
                            </a>
                        </div>
                    `;
                }
            } catch (error) { 
                document.getElementById('wordText').innerText = "Lỗi kết nối!"; 
            }
        }

        function renderCard() {
            if (words.length === 0) return;
            const currentWord = words[currentIndex];

            document.getElementById('wordText').innerText = currentWord.word;
            document.getElementById('phoneticText').innerText = currentWord.phonetic || "";
            document.getElementById('audioBtn').classList.remove('hidden');

            const posLabel = document.getElementById('posLabel');
            if(currentWord.part_of_speech) {
                posLabel.innerText = currentWord.part_of_speech;
                posLabel.classList.remove('hidden');
            } else posLabel.classList.add('hidden');

            document.getElementById('meaningText').innerText = currentWord.meaning;
            
            const exampleBox = document.getElementById('exampleBox');
            if(currentWord.example) {
                document.getElementById('exampleText').innerText = `"${currentWord.example}"`;
                document.getElementById('exampleTransText').innerText = currentWord.example_translation || "";
                exampleBox.classList.remove('hidden');
            } else exampleBox.classList.add('hidden');

            document.getElementById('progressText').innerText = `${currentIndex + 1} / ${words.length}`;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / words.length) * 100}%`;

            if (isFlipped) flipCard();
        }

        function flipCard() {
            if (words.length === 0) return;
            isFlipped = !isFlipped;
            const front = document.getElementById('card-front');
            const back = document.getElementById('card-back');
            if (isFlipped) {
                front.classList.add('rotate-y-180'); back.classList.remove('rotate-y-180');
            } else {
                front.classList.remove('rotate-y-180'); back.classList.add('rotate-y-180');
            }
        }

        async function playAudio(event) {
            event.stopPropagation(); 
            const btn = document.getElementById('audioBtn');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; 
            
            const currentWord = words[currentIndex].word;
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${currentWord}`);
                if (!res.ok) throw new Error("Không tìm thấy");
                const data = await res.json();
                let audioUrl = '';
                if (data && data[0] && data[0].phonetics) {
                    const phoneticObj = data[0].phonetics.find(p => p.audio && p.audio.length > 0);
                    if (phoneticObj) audioUrl = phoneticObj.audio;
                }
                if (audioUrl) {
                    new Audio(audioUrl).play();
                } else alert("Chưa có file ghi âm cho từ này.");
            } catch (err) { alert("Lỗi tải âm thanh."); } 
            finally { btn.innerHTML = originalIcon; }
        }

        async function markWord(isLearned) {
            if (words.length === 0) return;
            const currentWord = words[currentIndex];

            if (isLearned) {
                countLearned++; document.getElementById('learnedCount').innerText = countLearned;
            } else {
                countNotLearned++; document.getElementById('notLearnedCount').innerText = countNotLearned;
            }

            fetch('https://vocab-api-9689.onrender.com/api/progress/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: 1, vocab_id: currentWord.id, is_learned: isLearned })
            }).catch(e => console.log(e));

            if (currentIndex < words.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                showCompletionScreen();
            }
        }

        function showCompletionScreen() {
            const total = words.length;
            const learned = countLearned;
            const needReview = countNotLearned;
            const learnedPercent = total > 0 ? Math.round((learned / total) * 100) : 0;

            document.getElementById('completionSetName').innerText = document.getElementById('setHeader').innerText;
            document.getElementById('summaryTotal').innerText = total;
            document.getElementById('summaryLearned').innerText = learned;
            document.getElementById('summaryNeedReview').innerText = needReview;
            document.getElementById('summaryPercent').innerText = `${learnedPercent}%`;
            document.getElementById('summaryBar').style.width = `${learnedPercent}%`;

            let message = 'Bạn đã hoàn thành toàn bộ thẻ học trong phiên này.';
            if (learnedPercent === 100) {
                message = 'Xuất sắc! Bạn đã đánh dấu thuộc tất cả các từ trong lượt học này.';
            } else if (learnedPercent >= 70) {
                message = 'Rất tốt! Bạn đã nắm được phần lớn từ vựng, chỉ còn một ít từ cần ôn thêm.';
            } else if (learnedPercent >= 40) {
                message = 'Tiến bộ tốt! Hãy bấm “Ôn từ chưa thuộc” để củng cố thêm nhé.';
            } else {
                message = 'Không sao cả, bạn đã hoàn thành lượt học. Hãy ôn lại các từ chưa thuộc để nhớ lâu hơn.';
            }

            document.getElementById('summaryMessage').innerText = message;
            document.getElementById('shuffleAgainLink').href = `learn.html?set_id=${setId}&mode=${mode}&shuffle=1`;

            document.querySelector('main').classList.add('blur-sm', 'pointer-events-none', 'select-none');
            const modal = document.getElementById('completionModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function restartCurrentSession() {
            const shuffleParam = typeof shouldShuffleOnLoad !== 'undefined' && shouldShuffleOnLoad ? '&shuffle=1' : '';
            window.location.href = `learn.html?set_id=${setId}&mode=${mode}${shuffleParam}`;
        }

        function reviewUnlearned() {
            window.location.href = `learn.html?set_id=${setId}&mode=unlearned`;
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
