<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">

    <header class="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-10">
        <a href="index.html" class="text-gray-500 hover:text-blue-600 transition p-2"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h1 id="setHeader" class="font-bold text-lg text-gray-700 truncate px-4">Đang tải...</h1>
        <div class="w-8"></div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 w-full max-w-md mx-auto">
        
        <div class="w-full flex justify-between text-sm font-bold mb-4 px-2">
            <div class="text-orange-500"><i class="fa-solid fa-brain"></i> Chưa thuộc: <span id="notLearnedCount">0</span></div>
            <div class="text-gray-400" id="progressText">0 / 0</div>
            <div class="text-green-500"><i class="fa-solid fa-check-circle"></i> Đã thuộc: <span id="learnedCount">0</span></div>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2 mb-8">
            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <h2 id="wordText" class="text-4xl font-extrabold text-gray-800 mb-2">Đang tải...</h2>
        <div class="flex items-center justify-center gap-3 mb-2">
            <p id="phoneticText" class="text-gray-400 font-medium tracking-wide"></p>
            <button onclick="playAudio(event)" id="audioBtn" class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200 hover:scale-110 transition shadow-sm hidden" title="Nghe phát âm">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>

            <div id="card-back" class="absolute w-full h-full bg-blue-600 rounded-3xl shadow-lg flex flex-col items-center justify-center p-6 text-center transform-style-3d backface-hidden rotate-y-180 card-transition text-white">
                <h2 id="meaningText" class="text-2xl font-bold mb-4"></h2>
                <div id="exampleBox" class="bg-blue-700 bg-opacity-50 p-4 rounded-xl w-full hidden">
                    <p id="exampleText" class="italic mb-2 text-sm"></p>
                    <p id="exampleTransText" class="text-xs text-blue-200"></p>
                </div>
            </div>
        </div>

        <div class="flex gap-4 w-full mt-10">
            <button onclick="markWord(false)" class="flex-1 bg-white border-2 border-orange-200 text-orange-500 font-bold py-4 rounded-2xl hover:bg-orange-50 transition shadow-sm">
                <i class="fa-solid fa-xmark mr-2"></i> Chưa thuộc
            </button>
            <button onclick="markWord(true)" class="flex-1 bg-white border-2 border-green-200 text-green-500 font-bold py-4 rounded-2xl hover:bg-green-50 transition shadow-sm">
                <i class="fa-solid fa-check mr-2"></i> Đã thuộc
            </button>
        </div>
    </main>

    <script>
        let words = [];
        let currentIndex = 0;
        let isFlipped = false;
        let countLearned = 0;
        let countNotLearned = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const setId = urlParams.get('set_id') || 1;
        const mode = urlParams.get('mode') || 'all'; // Đọc xem đang học chế độ nào

        async function init() {
            try {
                // Tự động chuyển đổi link API dựa trên chế độ học
                let apiUrl = `https://vocab-api-9689.onrender.com/api/sets/${setId}/flashcards?user_id=1`;
                if (mode === 'unlearned') {
                    apiUrl = `https://vocab-api-9689.onrender.com/api/sets/${setId}/unlearned?user_id=1`;
                }

                const res = await fetch(apiUrl);
                const data = await res.json();
                
                document.getElementById('setHeader').innerText = data.set_title || "Bộ Từ Vựng";
                words = data.words;

                if (words && words.length > 0) {
                    renderCard();
                } else {
                    document.getElementById('wordText').innerText = "Hoàn thành!";
                    document.getElementById('phoneticText').innerText = "Bạn đã thuộc hết các từ trong bộ này.";
                    document.getElementById('audioBtn').classList.add('hidden');
                }
            } catch (error) { 
                document.getElementById('wordText').innerText = "Lỗi mạng!"; 
            }
        }

        function renderCard() {
            if (words.length === 0) return;
            const currentWord = words[currentIndex];

            document.getElementById('wordText').innerText = currentWord.word;
            document.getElementById('phoneticText').innerText = currentWord.phonetic || "";
            
            const posLabel = document.getElementById('posLabel');
            if(currentWord.part_of_speech) {
                posLabel.innerText = currentWord.part_of_speech;
                posLabel.classList.remove('hidden');
            } else posLabel.classList.add('hidden');

            document.getElementById('meaningText').innerText = currentWord.meaning;
            
            const exampleBox = document.getElementById('exampleBox');
            if(currentWord.example) {
                document.getElementById('exampleText').innerText = `"${currentWord.example}"`;
                document.getElementById('exampleTransText').innerText = currentWord.example_translation || "";
                exampleBox.classList.remove('hidden');
            } else exampleBox.classList.add('hidden');

            document.getElementById('progressText').innerText = `${currentIndex + 1} / ${words.length}`;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / words.length) * 100}%`;

            if (isFlipped) flipCard();
        }

        function flipCard() {
            if (words.length === 0) return;
            isFlipped = !isFlipped;
            const front = document.getElementById('card-front');
            const back = document.getElementById('card-back');
            if (isFlipped) {
                front.classList.add('rotate-y-180'); back.classList.remove('rotate-y-180');
            } else {
                front.classList.remove('rotate-y-180'); back.classList.add('rotate-y-180');
            }
        }

        // HÀM MỚI: Gửi API lưu tiến độ và chuyển bài
        async function markWord(isLearned) {
            if (words.length === 0) return;
            const currentWord = words[currentIndex];

            // Cập nhật số đếm trên màn hình ngay lập tức
            if (isLearned) {
                countLearned++;
                document.getElementById('learnedCount').innerText = countLearned;
            } else {
                countNotLearned++;
                document.getElementById('notLearnedCount').innerText = countNotLearned;
            }

            // Gửi dữ liệu về Backend chạy ngầm
            fetch('https://vocab-api-9689.onrender.com/api/progress/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: 1, vocab_id: currentWord.id, is_learned: isLearned })
            }).catch(e => console.log("Lỗi lưu tiến độ:", e));

            // Chuyển thẻ tiếp theo
            if (currentIndex < words.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                alert(`Tuyệt vời! Bạn đã học xong ${words.length} từ.\n- Đã thuộc: ${countLearned}\n- Cần ôn thêm: ${countNotLearned}`);
                window.location.href = "index.html";
            }
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
