<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Hiệu ứng lật thẻ 3D */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">

    <header class="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-10">
        <a href="index.html" class="text-gray-500 hover:text-blue-600 transition p-2">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h1 id="setHeader" class="font-bold text-lg text-gray-700 truncate px-4">Đang tải...</h1>
        <div class="w-8"></div> </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 w-full max-w-md mx-auto">
        
        <div class="w-full flex justify-between text-sm font-bold text-gray-500 mb-4 px-2">
            <span id="progressText">0 / 0</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2 mb-8">
            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <div id="flashcard-container" class="w-full perspective-1000 cursor-pointer h-80 relative" onclick="flipCard()">
            <div id="card-front" class="absolute w-full h-full bg-white rounded-3xl shadow-lg border border-gray-100 flex flex-col items-center justify-center p-6 text-center transform-style-3d backface-hidden card-transition">
                <span id="posLabel" class="absolute top-4 right-4 px-3 py-1 bg-blue-50 text-blue-600 text-xs font-bold uppercase rounded-lg hidden"></span>
                <h2 id="wordText" class="text-4xl font-extrabold text-gray-800 mb-2">Đang tải...</h2>
                <p id="phoneticText" class="text-gray-400 font-medium tracking-wide"></p>
                <div class="absolute bottom-6 text-gray-300 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-hand-pointer"></i> Nhấn để xem nghĩa
                </div>
            </div>

            <div id="card-back" class="absolute w-full h-full bg-blue-600 rounded-3xl shadow-lg flex flex-col items-center justify-center p-6 text-center transform-style-3d backface-hidden rotate-y-180 card-transition text-white">
                <h2 id="meaningText" class="text-2xl font-bold mb-4"></h2>
                <div id="exampleBox" class="bg-blue-700 bg-opacity-50 p-4 rounded-xl w-full hidden">
                    <p id="exampleText" class="italic mb-2 text-sm"></p>
                    <p id="exampleTransText" class="text-xs text-blue-200"></p>
                </div>
            </div>
        </div>

        <div class="flex gap-4 w-full mt-10">
            <button onclick="prevCard()" class="flex-1 bg-white border-2 border-gray-200 text-gray-600 font-bold py-4 rounded-2xl hover:bg-gray-50 hover:border-gray-300 transition shadow-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> Trước
            </button>
            <button onclick="nextCard()" class="flex-1 bg-white border-2 border-blue-600 text-blue-600 font-bold py-4 rounded-2xl hover:bg-blue-50 transition shadow-sm">
                Tiếp <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </main>

    <script>
        let words = [];
        let currentIndex = 0;
        let isFlipped = false;

        // Bóc tách tham số set_id từ URL (Ví dụ: ?set_id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const setId = urlParams.get('set_id') || 1; // Mặc định là 1 nếu không có tham số

        async function init() {
            try {
                // Gọi API kéo từ vựng của đúng bộ đó
                const res = await fetch(`https://vocab-api-9689.onrender.com/api/sets/${setId}/flashcards?user_id=1`);
                const data = await res.json();
                
                document.getElementById('setHeader').innerText = data.set_title || "Bộ Từ Vựng";
                words = data.words;

                if (words && words.length > 0) {
                    renderCard();
                } else {
                    document.getElementById('wordText').innerText = "Trống";
                    document.getElementById('phoneticText').innerText = "Chưa có từ vựng nào trong bộ này.";
                }
            } catch (error) {
                document.getElementById('wordText').innerText = "Lỗi mạng!";
                document.getElementById('phoneticText').innerText = "Không thể kết nối máy chủ.";
            }
        }

        function renderCard() {
            if (words.length === 0) return;
            const currentWord = words[currentIndex];

            // Mặt trước
            document.getElementById('wordText').innerText = currentWord.word;
            document.getElementById('phoneticText').innerText = currentWord.phonetic || "";
            
            const posLabel = document.getElementById('posLabel');
            if(currentWord.part_of_speech) {
                posLabel.innerText = currentWord.part_of_speech;
                posLabel.classList.remove('hidden');
            } else {
                posLabel.classList.add('hidden');
            }

            // Mặt sau
            document.getElementById('meaningText').innerText = currentWord.meaning;
            
            const exampleBox = document.getElementById('exampleBox');
            if(currentWord.example) {
                document.getElementById('exampleText').innerText = `"${currentWord.example}"`;
                document.getElementById('exampleTransText').innerText = currentWord.example_translation || "";
                exampleBox.classList.remove('hidden');
            } else {
                exampleBox.classList.add('hidden');
            }

            // Cập nhật tiến độ
            document.getElementById('progressText').innerText = `${currentIndex + 1} / ${words.length}`;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / words.length) * 100}%`;

            // Reset trạng thái lật thẻ khi sang từ mới
            if (isFlipped) flipCard();
        }

        function flipCard() {
            if (words.length === 0) return;
            isFlipped = !isFlipped;
            const front = document.getElementById('card-front');
            const back = document.getElementById('card-back');
            
            if (isFlipped) {
                front.classList.add('rotate-y-180');
                back.classList.remove('rotate-y-180');
            } else {
                front.classList.remove('rotate-y-180');
                back.classList.add('rotate-y-180');
            }
        }

        function nextCard() {
            if (currentIndex < words.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                alert("Chúc mừng! Bạn đã hoàn thành bộ từ vựng này.");
                window.location.href = "index.html"; // Lệnh tự động chuyển hướng về trang chủ
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        // Chạy hàm khởi tạo khi load trang
        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
